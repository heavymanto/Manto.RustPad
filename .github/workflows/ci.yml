# CI: i test del workspace a ogni push e pull request, su tutti e tre i sistemi.
# --no-fail-fast fa girare ogni binario di test anche quando uno precedente
# fallisce, cosi' un run racconta tutto. Formattazione e clippy girano su un
# solo sistema (non dipendono dalla piattaforma).
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test
        run: cargo test --workspace --no-fail-fast --manifest-path rust/Cargo.toml
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all --check --manifest-path rust/Cargo.toml
      - name: Clippy
        run: cargo clippy --workspace --all-targets --manifest-path rust/Cargo.toml -- -D warnings
