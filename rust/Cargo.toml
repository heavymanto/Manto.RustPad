# Workspace Cargo di Manto.RustPad.
#   mrp-core: motore (file mappato, indice righe, ricerca). Nessuna interfaccia.
#   (in arrivo) mrp-tui, poi la GUI: stesso schema di Manto.FreeDisk.
[workspace]
resolver = "2"
members = ["crates/*"]

# I profili vivono SOLO a livello workspace: Cargo ignora quelli dei crate member.
[profile.release]
lto = true
codegen-units = 1

# Il toolchain windows-gnu di rustup non ha la libreria di import shlwapi che la vera `webbrowser` collega: egui-winit la
# usa solo per aprire un indirizzo, e il sostituto locale lo fa con il comando del sistema.
[patch.crates-io]
webbrowser = { path = "vendor/webbrowser" }
